name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and Run Tests
      run: |
        if [ -f pom.xml ]; then
          mvn clean install
          mvn test
        else
          echo "No pom.xml found in repository root. Skipping Maven build and tests."
        fi
